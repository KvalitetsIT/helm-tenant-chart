# charts/project/ci/auditlog-values.yaml: simple flat schema with email format, enum and a free-form object.
values:
  - charts/project/ci/auditlog-values.yaml

cases:
  - name: valid event
    event:
      message: User viewed patient record
      actor: doctor@example.com
      action: READ
      data:
        resourceId: patient-42
        anything:
          - else
          - goes
          - here
    expect: accept

  - name: valid event without data
    event:
      message: User logged in
      actor: doctor@example.com
      action: READ
    expect: accept

  - name: missing message
    event:
      actor: doctor@example.com
      action: READ
    expect:
      reject: 'missing/invalid: message'

  - name: actor is not an email
    event:
      message: User viewed patient record
      actor: doctor
      action: READ
    expect:
      reject: 'invalid: actor must be a valid email address'

  - name: action not in enum
    event:
      message: User exported patient record
      actor: doctor@example.com
      action: EXPORT
    expect:
      reject: 'invalid: action must be one of READ, CREATE, UPDATE, DELETE'

  - name: data is not an object
    event:
      message: User viewed patient record
      actor: doctor@example.com
      action: READ
      data: patient-42
    expect:
      reject: 'invalid: data must be an object'
