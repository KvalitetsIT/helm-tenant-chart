# charts/project/ci/auditlog-values.yaml: email format, enum and requiredKeys.
values:
  - charts/project/ci/auditlog-values.yaml

cases:
  - name: valid event
    event:
      message: m
      actor: doctor@example.com
      action: READ
      data:
        resourceId: r1
        resourceType: PatientRecord
    expect: accept

  - name: actor is not an email
    event:
      message: m
      actor: doctor
      action: READ
      data:
        resourceId: r1
        resourceType: PatientRecord
    expect:
      reject: 'invalid: actor must be a valid email address'

  - name: action not in enum
    event:
      message: m
      actor: doctor@example.com
      action: EXPORT
      data:
        resourceId: r1
        resourceType: PatientRecord
    expect:
      reject: 'invalid: action must be one of READ, CREATE, UPDATE, DELETE'

  - name: missing required data
    event:
      message: m
      actor: doctor@example.com
      action: READ
    expect:
      reject: 'missing/invalid: data'

  - name: data missing a required key
    event:
      message: m
      actor: doctor@example.com
      action: READ
      data:
        resourceId: r1
    expect:
      reject: 'missing/invalid: data.resourceType'

  - name: data required key is an empty string
    event:
      message: m
      actor: doctor@example.com
      action: READ
      data:
        resourceId: ""
        resourceType: PatientRecord
    expect:
      reject: 'missing/invalid: data.resourceId'
