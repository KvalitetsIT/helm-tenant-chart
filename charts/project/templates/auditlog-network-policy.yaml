{{- if (.Values.auditlog).enabled }}
{{- $aggregatorPort := last (splitList ":" .Values.auditlog.config.aggregatorAddress) | int }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-audit-egress-to-aggregator
  namespace: {{ include "project.projectNamespace" . }}
  labels:
    {{- include "project.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      audit.kitkube.dk/vector-sidecar: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: logging
          podSelector:
            matchLabels:
              component: Aggregator
              name: vector
      ports:
        - port: {{ $aggregatorPort }}
          protocol: TCP
{{- end }}
