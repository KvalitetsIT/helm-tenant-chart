{{- if .Values.applicationSet.enabled }}
{{- $tenantName := include "tenant.name" . }}
{{- $git := .Values.applicationSet.generator.git }}
{{- $projectApp := .Values.projectDefaults.projectApplication }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $tenantName }}-projects
  namespace: {{ include "tenant.tenantNamespace" . }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  goTemplate: true
  {{- with .Values.applicationSet.syncPolicy }}
  syncPolicy:
    {{- with .applicationsSync }}
    applicationsSync: {{ . }}
    {{- end }}
    preserveResourcesOnDeletion: {{ .preserveResourcesOnDeletion | default false }}
  {{- end }}
  generators:
    - matrix:
        generators:
          - git:
              repoURL: {{ required "applicationSet.generator.git.repoURL is required" $git.repoURL | quote }}
              revision: {{ $git.revision | default "main" | quote }}
              files:
                {{- toYaml $git.files | nindent 16 }}
          # One element per project: union of the tenant and admin `projects` maps; the map key wins so a tenant can't spoof another project.
          - list:
              elementsYaml: |
{{ printf "                {{- $adminMap := `%s` | fromJson -}}" (include "tenant.applicationSetOverrides" .) }}
{{ `                {{- $tenant := .projects | default dict -}}
                {{- $names := concat (keys $tenant) (keys $adminMap) | uniq -}}
                {{- $out := list -}}
                {{- range $i, $name := $names -}}
                {{- $elem := mergeOverwrite (deepCopy (index $tenant $name | default dict)) (dict "name" $name) -}}
                {{- $out = append $out $elem -}}
                {{- end -}}
                {{ $out | toJson }}` }}
  template:
    metadata:
      name: '{{ `{{ .name }}` }}-project'
      namespace: {{ include "tenant.tenantNamespace" . }}
      labels:
        {{- include "tenant.labels" . | nindent 8 }}
      annotations:
        argocd.argoproj.io/sync-wave: "-10"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ include "tenant.projectAppProjectName" . }}
      source:
        repoURL: {{ required "projectDefaults.projectApplication.source.repoURL is required" $projectApp.source.repoURL | quote }}
        chart: {{ $projectApp.source.chart | default "project" | quote }}
        targetRevision: {{ required "projectDefaults.projectApplication.source.targetRevision is required" $projectApp.source.targetRevision | quote }}
      destination:
        namespace: {{ $tenantName }}-{{ `{{ .name }}` }}
        server: https://kubernetes.default.svc
      {{- with $projectApp.syncPolicy }}
      syncPolicy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # Effective valuesObject: admin base, then the tenant application block, then the admin project override (admin wins).
  # Only the tenant application is read, so quota and roles etc. stay admin-controlled. An unauthorized repoURL is rejected by the AppProject.
  # Fills global.projectName / global.projectNamespace per item. Here the namespace is always
  # <tenant>-<name>: per-project namespace.name overrides are unsupported under an ApplicationSet.
  templatePatch: |
{{ printf "    {{- $base := `%s` | fromJson -}}" (include "tenant.applicationSetBase" .) }}
{{ printf "    {{- $overrides := `%s` | fromJson -}}" (include "tenant.applicationSetOverrides" .) }}
{{ `    {{- $v := deepCopy $base -}}
    {{- $v = mergeOverwrite $v (dict "application" (.application | default dict)) -}}
    {{- $v = mergeOverwrite $v (index $overrides .name | default dict) -}}
    {{- $_ := set $v "projectName" .name -}}
    {{- $g := $v.global | default dict -}}
    {{- $_ := set $g "projectName" .name -}}
    {{- $_ := set $g "projectNamespace" (printf "%s-%s" $g.tenantName .name) -}}
    {{- $_ := set $v "global" $g -}}
    {{- (dict "spec" (dict "source" (dict "helm" (dict "valuesObject" $v)))) | toYaml -}}` }}
{{- end }}
