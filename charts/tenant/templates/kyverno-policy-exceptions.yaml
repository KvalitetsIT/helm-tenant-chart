{{- $tenantName := include "tenant.name" . }}
{{- range $name, $project := .Values.projects }}
{{- $p := fromYaml (include "tenant.merge" (dict "defaults" $.Values.projectDefaults "override" $project)) }}
{{- if $p.kyvernoPolicyExceptions.enabled }}
{{- $projectNs := include "tenant.projectNamespace" (list $tenantName $name) }}
{{- $kyvernoNs := $p.kyvernoPolicyExceptions.namespace | default "kyverno" }}
{{- range $exName, $exception := $p.kyvernoPolicyExceptions.exceptions }}
{{- if or (not (hasKey $exception "enabled")) $exception.enabled }}
---
apiVersion: policies.kyverno.io/v1alpha1
kind: PolicyException
metadata:
  name: {{ $projectNs }}-{{ $exName }}
  namespace: {{ $kyvernoNs }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
spec:
  policyRefs:
    {{- toYaml $exception.policyRefs | nindent 4 }}
  matchConditions:
    {{- toYaml $exception.matchConditions | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
