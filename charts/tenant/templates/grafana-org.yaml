{{- if and .Values.grafanaOrg.enabled (.Capabilities.APIVersions.Has "grafana-org-operator.kubitus-project.gitlab.io/v1beta1") }}
apiVersion: grafana-org-operator.kubitus-project.gitlab.io/v1beta1
kind: GrafanaOrg
metadata:
  name: {{ include "tenant.name" . }}-grafana-org
  namespace: tenants
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  grafanaInstanceRef: {{ .Values.grafanaOrg.grafanaInstanceRef }}
  orgName: {{ default (include "tenant.name" .) .Values.grafanaOrg.orgName }}
  {{- $tenantName := include "tenant.name" . }}
  {{- /* A roleGroup entry is repeated for every group granted that tenant role, as in the AppProjects. */}}
  {{- $orgMapping := list }}
  {{- range $entry := fromYamlArray (tpl (toYaml (.Values.grafanaOrg.orgMapping | default list)) $) }}
  {{- if $entry.roleGroup }}
    {{- if $entry.group }}
      {{- fail (printf "grafanaOrg.orgMapping: set either group or roleGroup, not both (roleGroup %q, group %q)" $entry.roleGroup $entry.group) }}
    {{- end }}
    {{- range (index $.Values.roleGroups $entry.roleGroup) | default (list (printf "%s-%s" $tenantName $entry.roleGroup)) }}
      {{- $orgMapping = append $orgMapping (merge (dict "group" .) (omit $entry "roleGroup")) }}
    {{- end }}
  {{- else }}
    {{- $orgMapping = append $orgMapping $entry }}
  {{- end }}
  {{- end }}
  {{- with $orgMapping }}
  orgMapping:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
