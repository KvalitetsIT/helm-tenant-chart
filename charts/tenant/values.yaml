# -- Optional. Name override for the tenant.
nameOverride: ""

# -- Optional. Namespace where ArgoCD is installed. AppProject resources must live in the ArgoCD root namespace.
argoNamespace: argocd

# -- Optional. Map of role name → AD/OIDC group list applied globally to all AppProjects.
# Acts as the lowest-precedence default — per-project `appProject.roles.<name>.groups` always wins.
roleGroups: {}

tenantNamespace:
  # -- Optional. Additional labels for the tenant namespace.
  labels: {}
  # -- Optional. Additional annotations for the tenant namespace.
  annotations: {}

# -- Opt-in self-service projects: discover them from a tenant-owned git repo via an ApplicationSet instead of the `projects` loop.
# Tenants may only set the `application` block (an unauthorized source.repoURL is rejected by the `<tenant>-apps` AppProject); admin `projects.<name>` entries win.
# @default -- See [values.yaml](values.yaml)
applicationSet:
  # -- Enable self-service projects. Mutually exclusive with the `projects` loop.
  enabled: false
  syncPolicy:
    # -- `create-only` | `create-update` | `create-delete`. `create-update` keeps projects dropped from the generator (removal becomes manual). Set "" to allow auto-deletion.
    applicationsSync: create-update
    # -- Keep the generated Applications' resources when the ApplicationSet is deleted.
    preserveResourcesOnDeletion: true
  generator:
    git:
      # -- Required. Git repo holding the tenant projects file.
      repoURL: ""
      # -- Git branch, tag, or commit SHA.
      revision: main
      # -- File(s) holding the `projects` map (same shape as the admin map).
      files:
        - path: "projects.yaml"

# -----------------------------------------------------------------------
# PER-PROJECT DEFAULTS
# Deep-merged with each entry under projects.<name> — project values win.
# See the project chart values for additional options:
# https://github.com/KvalitetsIT/helm-repo/blob/master/project/README.md#values
# -----------------------------------------------------------------------

# -- Shared defaults applied to every project.
# All keys are deep-merged with `projects.<name>` — project values win.
# See the [project chart values](../project/README.md#values) for the full schema,
# including `limitRange`, `templates`, `appProject`, and `namespace`.
# @default -- See [values.yaml](values.yaml)
projectDefaults:

  # -- Default deployment config for `<project>-project` Applications (runs the project chart).
  # Governed by the `<tenant>-projects` AppProject.
  # Per-project override: `projects.<name>.projectApplication`.
  # @default -- See [values.yaml](values.yaml)
  projectApplication:
    source:
      # -- Required. OCI/Helm repository URL for the project chart.
      repoURL: "https://raw.githubusercontent.com/KvalitetsIT/helm-repo/master/"
      # -- Required. Chart name within the repository.
      chart: project
      # -- Required. Chart version to deploy. Supports semver ranges.
      targetRevision: "2.1.*"
    # -- Optional. Sync policy for the `<project>-project` Applications: auto-sync + self-heal,
    # with prune/cascade-delete gated behind manual UI confirmation. Declares `enabled` so a UI
    # auto-sync toggle surfaces as drift (ArgoCD 3.1+).
    syncPolicy:
      automated:
        enabled: true
        prune: true
        selfHeal: true
      syncOptions:
        - Prune=confirm
        - Delete=confirm

  # -- Default config for `<project>-apps` Applications (app-of-apps).
  # Governed by the `<tenant>-apps` AppProject.
  # `source.path` cannot be set here — it must be provided per project.
  # Per-project override: `projects.<name>.application`.
  # @default -- See [values.yaml](values.yaml)
  application:
    source:
      # -- Required. Default git repository URL for the app-of-apps.
      repoURL: ""
      # -- Required. Default git branch, tag, or commit SHA.
      targetRevision: ""
      # -- Optional. Default Helm value files passed to the app-of-apps Application.
      # Per-project overrides replace this list entirely.
      helm:
        valueFiles:
          - values.yaml

  # -- Default ResourceQuota passed to every project via the project chart.
  # `limits.cpu`, `limits.memory`, and `requests.storage` have no project chart defaults — they must be set here or per project.
  # Per-project override: `projects.<name>.resourceQuota`.
  # @default -- See [values.yaml](values.yaml)
  resourceQuota:
    spec:
      hard:
        # -- Required
        limits.cpu: ""
        # -- Required
        limits.memory: ""
        # -- Required
        requests.storage: ""

# -----------------------------------------------------------------------
# TENANT PROJECTS
# Each key becomes a project named <tenant>-<key>.
# -----------------------------------------------------------------------

# -- Map of tenant projects to create.
# Each key becomes a project named `<tenant>-<key>`.
# See [Projects](#projects) for the full schema and examples.
projects: {}

# -----------------------------------------------------------------------
# KEYCLOAK GROUP
# Creates a KeycloakGroup for the tenant in Keycloak.
# Requires the keycloak-operator CRD to be installed on the cluster
# (keycloak.hostzero.com/v1beta1).
# -----------------------------------------------------------------------

# @default -- See [values.yaml](values.yaml)
keycloakGroup:
  # -- Enable KeycloakGroup resource creation.
  # Also requires the keycloak-operator CRD to be present in the cluster.
  enabled: false

  # -- Namespace where the KeycloakGroup resource is created.
  namespace: auth

  # -- Keycloak realm to create the group in.
  realmRef: infrastructure

  # -- Parent group under which the tenant group is nested.
  parentGroupRef: tenants

# -----------------------------------------------------------------------
# GRAFANA ORG
# Creates a GrafanaOrg and GrafanaOrgDatasource resources in the `tenants`
# namespace. Requires the grafana-org-operator CRD to be installed on the
# cluster (grafana-org-operator.kubitus-project.gitlab.io/v1beta1).
# -----------------------------------------------------------------------

# @default -- See [values.yaml](values.yaml)
grafanaOrg:
  # -- Enable GrafanaOrg and GrafanaOrgDatasource resources.
  # Also requires the grafana-org-operator CRD to be present in the cluster.
  enabled: false

  # -- Cross-namespace ref to the GrafanaInstance.
  grafanaInstanceRef: "monitoring/grafana"

  # -- Grafana display name for the org. Defaults to the tenant name.
  orgName: ""

  # -- OIDC group → Grafana role mappings.
  # @default -- See [values.yaml](values.yaml)
  orgMapping:
    - group: cluster-admin
      role: Admin
      provider: generic_oauth
    - group: cluster-readonly
      role: Viewer
      provider: generic_oauth
    - group: '{{ include "tenant.name" . }}-developer'
      role: Editor
      provider: generic_oauth
    - group: '{{ include "tenant.name" . }}-viewer'
      role: Viewer
      provider: generic_oauth

  # -- Map of datasources to provision under this org.
  # Loki and Prometheus are pre-configured with standard cluster-local endpoints.
  # `secureJsonData.httpHeaderValue1` auto-defaults to the release namespace if not set,
  # which populates the tenant-isolation header (X-Scope-OrgId / X-Namespace).
  # @default -- See [values.yaml](values.yaml)
  datasources:
    loki:
      name: Loki
      type: loki
      url: http://loki.logging.svc.cluster.local:3100
      jsonData:
        tlsSkipVerify: true
        httpHeaderName1: X-Scope-OrgId
      secureJsonData:
        httpHeaderValue1: '{{ include "tenant.name" . }}'
    prometheus:
      name: Prometheus
      type: prometheus
      url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
      jsonData:
        tlsSkipVerify: true
        httpHeaderName1: X-Namespace
      secureJsonData:
        httpHeaderValue1: '{{ include "tenant.name" . }}-.*'
